<!DOCTYPE html>
<html lang="ro">
<head>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Asigurare de viață</title>
</head>
<body>
  <header class="jig-header">
    <div class="container">
      <div class="brand">
        <span class="logo">.JIG</span>
        <span class="team">by St. Artur</span>
      </div>
      <div class="header-actions">
<a href="settings.html" class="icon-btn" aria-label="Settings">

       fill="none"
       stroke="#ffffff"
       stroke-width="2"

             l-.06.06

             l.06-.06

             1.65 1.65 0 0 0-1.51-1H3

        <div class="lang">
          <label for="langSelect" id="langLabel">Limbă</label>
          <select id="langSelect">
            <option value="ro">RO</option>
            <option value="ru">RU</option>
            <option value="en">EN</option>
          </select>
        </div>
      </div>
</div>
  </header>

<div class="calculator">
  <!-- Источники расчёта (PDF: информация + таблицы тарифов) -->
  <div class="notice-bar" role="note">
    <div class="notice-text" id="sourcesNote">Calculul se face pe baza tarifelor. Vezi sursele (PDF).</div>
    <a class="notice-link" href="sources.html" id="sourcesLink" aria-label="Sources">
      <!-- inline icon -->
      <svg class="notice-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Zm0 2.5L19.5 11H14V5.5ZM8 13h8v2H8v-2Zm0 4h8v2H8v-2Z" />
      </svg>
    </a>
  </div>

  <div class="topbar">
    <h2 id="appTitle">Asigurare de viață</h2>
  </div>

  <!-- ВОЗРАСТ -->
  <div class="field">
    <label id="ageLabel">Vârstă</label>

    <div class="age-control">
      <button id="ageMinus" class="age-btn" type="button">−</button>

      <div class="age-value">
        <span id="ageValue">0</span>
        <span class="age-unit" id="ageUnit">ani</span>
      </div>

      <button id="agePlus" class="age-btn" type="button">+</button>
    </div>

    <input type="range" id="ageRange" min="0" max="65" step="1" value="0">
  </div>

  <!-- ВЗНОС -->
  <div class="field">
    <label>
      <span id="paymentLabel">Primă anuală</span>:
      <span id="paymentValue"></span>
    </label>

    <div class="slider-wrap">
      <input type="range" id="payment">
    </div>
  </div>

  <!-- СРОК -->
  <div class="field">
    <label id="termLabel">Durata asigurării (ani)</label>
    <div id="years" class="years-grid"></div>
  </div>

  <h3 class="section-title" id="tariffsTitle">Tarife</h3>
  <div id="result"></div>

  <div class="disclaimer" id="disclaimer" role="note" aria-label="Disclaimer">
    <div class="disclaimer-title" id="disclaimerTitle">Declarație de responsabilitate</div>
    <div class="disclaimer-text" id="disclaimerText"></div>
  </div>
</div>

<!-- PDF Viewer Overlay -->
<div id="pdfOverlay" class="pdf-overlay" aria-hidden="true">
  <div class="pdf-header">
    <div class="pdf-title" id="pdfTitle">PDF</div>
    <button id="pdfClose" class="pdf-close" type="button" aria-label="Close">✕</button>
  </div>
  <iframe id="pdfFrame" class="pdf-frame" src="" title="PDF Viewer"></iframe>
</div>
<footer>© 2025 .JIG by Artur Stefirta</footer>

<!-- 5 книг данных (Путь A: разные переменные) -->
<script src="Data_start.js"></script>
<script src="Data_RiskLife.js"></script>
<script src="Data_Profit.js"></script>
<script src="Data_Orizont.js"></script>
<script src="Data_omnia_vital.js"></script>

<script src="script.js"></script>
</body>
</html>
