<!DOCTYPE html>
<html lang="ro">
<head>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Oferta</title>
</head>
<body>
  <header class="jig-header">
    <div class="container">
      <div class="brand">
        <span class="logo">.JIG</span>
        <span class="team">by St. Artur</span>
      </div>
      <div class="header-actions">

        <div class="lang">
          <label for="langSelect" id="langLabel">Limbă</label>
          <select id="langSelect">
            <option value="ro">RO</option>
            <option value="ru">RU</option>
            <option value="en">EN</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <div class="calculator quote-page">
    <div class="topbar">
      <button id="backBtn" class="ghost-btn" type="button">←</button>
      <h2 id="quoteTitle">Ofertă</h2>
    </div>

    <div class="field">
      <label id="calcLabel">Date calculate</label>
      <div class="summary-card" id="summary"></div>
    </div>

    <h3 class="section-title" id="brokerTitle">Date broker</h3>
    <div class="field">
      <label id="brokerNameLabel">Nume</label>
      <input id="brokerFirst" type="text" autocomplete="given-name" />
    </div>
    <div class="field">
      <label id="brokerLastLabel">Prenume</label>
      <input id="brokerLast" type="text" autocomplete="family-name" />
    </div>
    <div class="field">
      <label id="brokerPhoneLabel">Telefon</label>
      <input id="brokerPhone" type="tel" autocomplete="tel" />
    </div>

    <div class="field">
      <label id="brokerEmailLabel">Email</label>
      <input id="brokerEmail" type="email" autocomplete="email" placeholder="broker@gmail.com" />
    </div>

    <h3 class="section-title" id="clientTitle">Date client</h3>
    <div class="field">
      <label id="clientEmailLabel">Email client</label>
      <input id="clientEmail" type="email" autocomplete="email" placeholder="client@email.com" />
    </div>
    <div class="field">
      <label id="clientFirstLabel">Nume</label>
      <input id="clientFirst" type="text" autocomplete="given-name" />
    </div>
    <div class="field">
      <label id="clientLastLabel">Prenume</label>
      <input id="clientLast" type="text" autocomplete="family-name" />
    </div>
    <div class="field">
      <label id="clientDobLabel">Data nașterii</label>
      <input id="clientDob" type="date" />
    </div>

    <div class="actions">
      <button id="sendBtn" class="primary-btn" type="button">Trimite pe email</button>
    </div>

    <div class="disclaimer" id="quoteNote" role="note" aria-label="Note">
      <div class="disclaimer-title" id="noteTitle">Notă</div>
      <div class="disclaimer-text" id="noteText"></div>
    </div>
  </div>

  <footer>© 2025 .JIG by Artur Stefirta</footer>

  <script src="quote.js"></script>
</body>
</html>
